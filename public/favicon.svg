<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Simple globe/world icon -->
  <circle cx="16" cy="16" r="14" fill="#4A90E2" stroke="#2E5B8A" stroke-width="2"/>
  
  <!-- Continents/landmasses -->
  <g fill="#2E5B8A">
    <!-- Top continent -->
    <path d="M8 8 Q12 6 16 8 Q20 6 24 8 Q22 12 16 10 Q10 12 8 8"/>
    
    <!-- Middle continent -->
    <path d="M6 14 Q10 16 14 14 Q18 16 22 14 Q26 16 28 18 Q24 20 20 18 Q16 20 12 18 Q8 20 4 18 Q6 16 6 14"/>
    
    <!-- Bottom continent -->
    <path d="M10 22 Q14 24 18 22 Q22 24 26 22 Q24 26 20 24 Q16 26 12 24 Q8 26 10 22"/>
  </g>
  
  <!-- Grid lines -->
  <g stroke="#2E5B8A" stroke-width="1" fill="none" opacity="0.6">
    <!-- Horizontal lines -->
    <line x1="2" y1="16" x2="30" y2="16"/>
    <ellipse cx="16" cy="16" rx="14" ry="7"/>
    <ellipse cx="16" cy="16" rx="14" ry="10"/>
    
    <!-- Vertical lines -->
    <line x1="16" y1="2" x2="16" y2="30"/>
    <ellipse cx="16" cy="16" rx="7" ry="14"/>
    <ellipse cx="16" cy="16" rx="10" ry="14"/>
  </g>
</svg>
